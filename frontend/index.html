<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Music Library Diff</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="page">
    <header class="page-header">
      <h1>Music Library Diff</h1>
      <p class="subtitle">Compara duas bibliotecas de música em PCs diferentes, sem copiar, mover ou apagar nada.</p>
    </header>

    <section class="panel" id="form-panel">
      <div class="library-fields">
        <div class="field field-a">
          <label for="library-a"><span class="dot dot-a"></span>Biblioteca A · pasta local</label>
          <input id="library-a" type="text" placeholder="D:\Music" autocomplete="off" spellcheck="false" />
        </div>
        <div class="field field-b">
          <label for="library-b"><span class="dot dot-b"></span>Biblioteca B · local ou rede</label>
          <input id="library-b" type="text" placeholder="\\PC-DESKTOP\Music" autocomplete="off" spellcheck="false" />
        </div>
      </div>
      <button id="analyze-btn" type="button">Analisar</button>
      <p id="form-error" class="error-text" hidden></p>
    </section>

    <section class="panel" id="progress-panel" hidden>
      <p id="progress-message" class="progress-message">Preparando...</p>
      <div class="progress-track">
        <div id="progress-fill" class="progress-fill"></div>
      </div>
      <p id="progress-count" class="muted"></p>
    </section>

    <section class="panel" id="results-panel" hidden>
      <div class="summary-row" id="summary-row"></div>

      <div id="errors-banner" class="errors-banner" hidden></div>

      <div class="tabs" id="tabs"></div>

      <div class="filters">
        <input id="f-text" class="wide" type="search" placeholder="Buscar artista, título, álbum ou caminho" spellcheck="false" />
        <input id="f-folder" type="text" placeholder="Pasta contém..." spellcheck="false" />
        <select id="f-side" title="Aplicar os filtros a qual lado">
          <option value="any">Qualquer lado</option>
          <option value="A">Só lado A</option>
          <option value="B">Só lado B</option>
        </select>
        <select id="f-format"><option value="">Formato</option></select>
        <select id="f-samplerate"><option value="">Sample rate</option></select>
        <select id="f-bitdepth"><option value="">Bit depth</option></select>
        <div class="range"><input id="f-bitrate-min" type="number" min="0" placeholder="kbps mín" /><input id="f-bitrate-max" type="number" min="0" placeholder="kbps máx" /></div>
        <div class="range"><input id="f-size-min" type="number" min="0" step="any" placeholder="MB mín" /><input id="f-size-max" type="number" min="0" step="any" placeholder="MB máx" /></div>
        <div class="range"><input id="f-dur-min" type="number" min="0" step="any" placeholder="min mín" /><input id="f-dur-max" type="number" min="0" step="any" placeholder="min máx" /></div>
        <select id="f-sort">
          <option value="title">Ordenar: título</option>
          <option value="artist">Ordenar: artista</option>
          <option value="format">Ordenar: formato</option>
          <option value="bitrate">Ordenar: bitrate</option>
          <option value="size">Ordenar: tamanho</option>
          <option value="duration">Ordenar: duração</option>
          <option value="path">Ordenar: caminho</option>
        </select>
        <select id="f-dir"><option value="asc">Crescente</option><option value="desc">Decrescente</option></select>
        <button id="f-clear" type="button" class="btn-secondary">Limpar filtros</button>
      </div>

      <div class="selection-bar">
        <label class="check"><input type="checkbox" id="select-all" /> Selecionar todos os filtrados</label>
        <span id="selection-count" class="muted"></span>
        <div class="actions">
          <button type="button" class="btn-secondary" data-op="copy-ab">Copiar A para B</button>
          <button type="button" class="btn-secondary" data-op="copy-ba">Copiar B para A</button>
          <button type="button" class="btn-danger" data-op="del-a">Apagar de A</button>
          <button type="button" class="btn-danger" data-op="del-b">Apagar de B</button>
          <button type="button" class="btn-danger" data-op="del-both">Apagar de ambos</button>
        </div>
      </div>

      <p id="result-count" class="muted"></p>
      <ul class="results-list" id="results-list"></ul>
      <button id="show-more" type="button" class="btn-secondary" hidden>Mostrar mais</button>
    </section>

    <div class="modal" id="modal" hidden>
      <div class="modal-box" id="modal-box"></div>
    </div>
  </main>

  <script src="/app.js"></script>
</body>
</html>
